  const isParticipant = mode === 'participant';

  const wrap = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '18px' } });
  const total = state.quiz.questions.length;
  const answered = q.votes.length;
  const participants = Math.max(participantCount(), answered);
  const revealed = q.status === 'revealed';
  const mineVote = q.votes.find(v => v.voter === myId);
  const pickedIdx = ui.pickedAnswers[q.id];
  const hasPicked = pickedIdx !== undefined;
  const isActive = q.status === 'active';
  const canInteract = isParticipant && isActive && !mineVote;

  const header = h('div', { class: 'q-header' });
  header.appendChild(h('div', { class: 'q-badge' }, 'Question ' + (idx + 1) + ' of ' + total));
  if (isActive) {
    const timer = h('div', { class: 'q-timer' });
    timer.appendChild(h('div', { class: 'timer-bar-track' }, h('div', {
      class: 'timer-bar', 'data-timer-bar': q.id,
      style: { width: (Math.max(0, (q.timeLimit - (Date.now() - q.startedAt) / 1000) / q.timeLimit * 100)) + '%' } })));
    timer.appendChild(h('div', { class: 'timer-num', 'data-timer': q.id }, q.timeLimit + 's'));
    header.appendChild(timer);
  } else {
    header.appendChild(h('div', { class: 'q-timer' }, h('span', { class: 'muted-sm' }, '⏱ ' + q.timeLimit + 's limit')));
  }
  header.appendChild(h('div', { class: 'q-answered-pill' },
    h('span', { class: 'n' }, answered),
    h('span', {}, 'of ' + participants + ' answered')));
  if (isParticipant && isActive && !mineVote) header.appendChild(h('div', { class: 'vote-ready' }, '✋ You can vote'));
  if (isParticipant && mineVote) header.appendChild(h('div', { class: 'vote-ready' }, '✓ Voted'));
  wrap.appendChild(header);
  wrap.appendChild(h('div', { class: 'quiz-question' }, q.text));

  const counts = new Array(q.options.length).fill(0);
  q.votes.forEach(v => { if (v.value >= 0 && v.value < counts.length) counts[v.value]++; });
  const totalVotes = q.votes.length || 1;
  const showStats = revealed || isPresenter;
  const optionsWrap = h('div', { class: 'quiz-options' });

  q.options.forEach((opt, i) => {
    const isCorrect = i === q.correctIndex;
    const isMine = mineVote && mineVote.value === i;
    const isPicked = canInteract && hasPicked && pickedIdx === i;
    const pct = Math.round(counts[i] / totalVotes * 100);
    const classes = ['quiz-opt'];
    if (revealed && isCorrect) classes.push('correct');
    if (revealed && !isCorrect && counts[i] > 0) classes.push('wrong');
    if (isMine) classes.push('mine');
    if (isPicked) classes.push('picked');
    if (canInteract) classes.push('pickable');

    const optEl = h('div', { class: classes.join(' '), 'data-opt-idx': canInteract ? String(i) : null },
      h('div', { class: 'opt-bar', style: { width: showStats ? pct + '%' : '0%' } }),
      h('div', { class: 'opt-letter' }, h('span', {}, LETTERS[i])),
      h('div', { class: 'opt-text' }, opt),
      showStats ? h('div', { class: 'opt-count' }, counts[i] + (revealed ? ' · ' + pct + '%' : '')) : null);

    if (canInteract) optEl.addEventListener('click', (ev) => { ev.preventDefault(); ev.stopPropagation(); pickAnswer(q, i, optEl); });
    optionsWrap.appendChild(optEl);
  });
  wrap.appendChild(optionsWrap);

  if (isParticipant && isActive && !mineVote) {
    const row = h('div', { class: 'submit-row', 'data-submit-row': q.id });
    const hint = h('div', { class: 'hint' });
    if (hasPicked) { hint.appendChild(document.createTextNode('Your pick: ')); hint.appendChild(h('b', {}, LETTERS[pickedIdx] + '. ' + q.options[pickedIdx])); }
    else hint.textContent = '👆 Tap an option to select your answer';
    row.appendChild(hint);
    const submitBtn = btn('Submit answer', 'btn-primary btn-lg', () => {
      const pick = ui.pickedAnswers[q.id];
      if (pick === undefined) { toast('Pick an option first'); return; }
      submitQuizAnswer(q, pick);
    });
    if (!hasPicked) submitBtn.disabled = true;
    submitBtn.setAttribute('data-submit-btn', q.id);
    row.appendChild(submitBtn);
    wrap.appendChild(row);
  }
  if (isParticipant && isActive && mineVote) {
    wrap.appendChild(h('div', { class: 'submit-row locked' },
      h('div', { class: 'hint' }, '✓ Submitted: ', h('b', {}, LETTERS[mineVote.value] + '. ' + q.options[mineVote.value]), ' — waiting for the timer…')));
  }

  if (isPresenter) {
    const actions = h('div', { class: 'quiz-actions' });
    const isCurrent = idx === state.quiz.currentIndex;
    const canReveal = isActive && isCurrent;
    const canNext = revealed && isCurrent;
    const isLast = idx === state.quiz.questions.length - 1;
    actions.appendChild(h('span', { class: 'participant-pill' },
      'Correct: ', h('b', {}, LETTERS[q.correctIndex] + '. ' + q.options[q.correctIndex])));
    actions.appendChild(h('span', { class: 'spacer' }));
    if (canReveal) actions.appendChild(btn('👁 Reveal answer', 'btn-ok', () => revealQuestion(q)));
    if (canNext) actions.appendChild(btn(isLast ? '🏁 Finish quiz' : 'Next question →', 'btn-primary', nextQuestion));
    actions.appendChild(btn('✎ Edit', 'btn-ghost btn-sm', () => openQuizComposer(idx)));
    actions.appendChild(btn('✕ Delete', 'btn-ghost btn-sm danger', () => deleteQuizQuestion(idx)));
    wrap.appendChild(actions);
  }

  if (revealed && !isPresenter) {
    const correctText = LETTERS[q.correctIndex] + '. ' + q.options[q.correctIndex];
    wrap.appendChild(h('div', { class: 'winner-card' },
      h('div', { class: 'trophy' }, '✅'),
      h('div', { class: 'w-info' }, h('div', { class: 'w-title' }, 'Correct answer'), h('div', { class: 'w-name' }, correctText))));
  }

  if (revealed) {
    const winner = fastestCorrect(q);
    if (winner) {
      wrap.appendChild(h('div', { class: 'winner-card' },
        h('div', { class: 'trophy' }, '🏆'),
        h('div', { class: 'w-info' },
          h('div', { class: 'w-title' }, 'Fastest correct answer'),
          h('div', { class: 'w-name' }, winner.name),
          h('div', { class: 'w-stats' }, ((winner.timestamp - q.startedAt) / 1000).toFixed(1) + 's · Correct')),
        h('div', { class: 'w-points' }, '+' + winner.score)));
    } else {
      wrap.appendChild(h('div', { class: 'winner-card', style: { background: '#F0F2F5', borderColor: '#D1D9E6' } },
        h('div', { class: 'trophy' }, '🤷'),
        h('div', { class: 'w-info' }, h('div', { class: 'w-title', style: { color: '#7A848F' } }, 'No correct answers'), h('div', { class: 'w-name', style: { color: '#4A5561' } }, 'Better luck next time!'))));
    }
  }
  return wrap;
}

function pickAnswer(q, idx, optEl) {
  if (q.status !== 'active') return;
  if (q.votes.find(v => v.voter === myId)) return;
  ui.pickedAnswers[q.id] = idx;
  const optionsWrap = optEl.parentElement;
  if (optionsWrap) {
    optionsWrap.querySelectorAll('.quiz-opt').forEach(el => {
      const elIdx = Number(el.getAttribute('data-opt-idx'));
      el.classList.toggle('picked', elIdx === idx);
    });
  }
  const row = document.querySelector('[data-submit-row="' + q.id + '"]');
  if (row) {
    const hint = row.querySelector('.hint');
    if (hint) {
      hint.innerHTML = '';
      hint.appendChild(document.createTextNode('Your pick: '));
      const b = document.createElement('b');
      b.textContent = LETTERS[idx] + '. ' + q.options[idx];
      hint.appendChild(b);
    }
    const submitBtn = row.querySelector('[data-submit-btn]');
    if (submitBtn) submitBtn.disabled = false;
  }
}

/* ============================================================

function renderDuckPond(parts, minHeight) {
  const pond = h('div', { class: 'duck-pond', style: minHeight ? { minHeight: minHeight + 'px' } : {} });
  if (!parts.length) {
    pond.appendChild(h('div', { class: 'duck-empty' },
      h('div', { class: 'big' }, '🦆'),
      h('div', {}, 'No ducks in the pond yet'),
      h('div', { class: 'sub' }, 'Names will appear as people scan.')));
    return pond;
  }
  parts.forEach((p, i) => {
    const top = 5 + Math.random() * 60;
    const left = 4 + Math.random() * 62;
    const dx = 30 + Math.random() * 70;
    const dy = -20 + Math.random() * 20;
    const dur = 9 + Math.random() * 7;
    const delay = -Math.random() * 6;
    const color = DUCK_COLORS[i % DUCK_COLORS.length];
    pond.appendChild(h('div', { class: 'duck', style: {
      top: top + '%', left: left + '%',
      '--dx': dx + 'px', '--dy': dy + 'px',
      '--dur': dur + 's', '--delay': delay + 's', '--color': color
    }},
      h('div', { class: 'duck-body' }),
      h('div', { class: 'duck-head' }),
      h('div', { class: 'duck-eye' }),
      h('div', { class: 'duck-beak' }),
      h('div', { class: 'duck-label', title: p.name }, p.name || 'Anonymous')));
  });
  return pond;
}

  const wrap = h('div', { class: 'page narrow' });

    const join = h('section', { class: 'panel pad' });

    wrap.appendChild(join);

  }

  const hasLivePoll = state.polls.some(p => p.status === 'live');

  const head = h('section', { class: 'panel pad' });
  head.appendChild(h('div', { class: 'section-head' },
    h('h2', {}, '🎯 ' + quiz.title),
    h('span', { class: 'pill' + (quiz.status === 'running' ? '' : ' blue') }, quiz.status)));
  head.appendChild(h('div', { class: 'quiz-meta', style: { gap: '18px' } },
    h('div', {}, 'Player: ', h('b', {}, getParticipantName())),
    h('div', {}, 'Questions: ', h('b', {}, quiz.questions.length))));
  wrap.appendChild(head);

  if (hasLivePoll) {
    state.polls.filter(p => p.status === 'live').forEach(poll => {
      wrap.appendChild(participantPollCard(poll));
    });
  }

  if (quiz.status === 'idle' || quiz.status === 'finished') {
    if (!hasLivePoll) {
      const s = h('section', { class: 'panel pad' });
      s.appendChild(h('div', { class: 'empty-state' },
        h('div', { class: 'empty-icon' }, quiz.status === 'finished' ? '🏁' : '⏳'),
        h('p', {}, quiz.status === 'finished' ? 'Quiz finished!' : 'Waiting for the host to start…'),
        h('span', {}, quiz.status === 'finished' ? 'Thanks for playing!' : 'Get ready — the first question is coming up.')));
      if (quiz.status === 'finished') {
        s.appendChild(h('div', { style: { textAlign: 'center', marginTop: '16px' } },
          btn('🏆 View Final Leaderboard', 'btn-primary', () => {
            ui.leaderboardPopupDismissed = false;
            render();
          })));
      }
      wrap.appendChild(s);
    }
  } else {
    const idx = quiz.currentIndex;
    const q = quiz.questions[idx];
    if (q) {
      const card = h('section', { class: 'panel pad' });
      card.appendChild(renderQuizQuestion(q, idx, 'participant'));
      wrap.appendChild(card);
    }
  }

  /* Duck pond: only shown before the quiz starts (idle) — hidden during the live quiz */
  if (quiz.status !== 'running') {
    const duckSection = h('section', { class: 'panel', style: { overflow: 'hidden' } });
    duckSection.appendChild(h('div', {
      style: { display: 'flex', alignItems: 'center', gap: '10px', padding: '16px 20px 12px', borderBottom: '1px solid var(--line)' }
    },
      h('h2', { style: { fontSize: '16px', fontWeight: '800', color: 'var(--pc-blue)', margin: 0 } }, '🦆 Who\'s in the pond'),
      h('span', { class: 'pill blue', style: { marginLeft: 'auto' } }, participantCount() + ' joined')));
    const pondWrap = h('div', { style: { padding: '14px' } });
    pondWrap.appendChild(renderDuckPond(participantList(), 300));
    duckSection.appendChild(pondWrap);
    wrap.appendChild(duckSection);
  }

  return wrap;
}

function participantPollCard(poll) {
  const card = h('article', { class: 'poll-card' });
  const mine = poll.votes.find(v => v.voter === myId);
  card.appendChild(h('div', { class: 'poll-card-head' },
    h('span', { class: 'badge' }, TYPE_LABEL[poll.type]),
    h('span', { class: 'status live' }, 'Live')));
  card.appendChild(h('h3', { class: 'poll-card-q' }, poll.question));

  if (poll.type === 'multiple_choice') {
    const opts = h('div', { class: 'options' });
    poll.options.forEach((o, i) => {
      opts.appendChild(h('button', {
        class: 'option' + (mine && String(mine.value) === String(i) ? ' chosen' : ''),
        onclick: () => pollVote(poll, i)
      }, h('span', { class: 'opt-mark' }), h('span', {}, o)));
    });
    card.appendChild(opts);
  } else if (poll.type === 'rating') {
    const row = h('div', { class: 'rating-row' });
    for (let i = 0; i < 5; i++) {
      row.appendChild(h('button', {
        class: 'rate-btn' + (mine && String(mine.value) === String(i) ? ' chosen' : ''),
        onclick: () => pollVote(poll, i)
      }, String(i + 1)));
    }
    card.appendChild(row);
    card.appendChild(h('div', { class: 'rating-labels' }, h('span', {}, 'Poor'), h('span', {}, 'Excellent')));
  } else if (poll.type === 'word_cloud') {
    const input = h('input', { class: 'input', placeholder: 'Type a word…', maxlength: '24' });
    const send = () => { const v = input.value.trim(); if (!v) return; pollVote(poll, v); };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    card.appendChild(h('div', { class: 'ask-row' }, input, btn('Send', 'btn-primary', send)));
  } else {
    const ta = h('textarea', { class: 'input', placeholder: 'Share your thoughts…', maxlength: '300' });
    card.appendChild(h('div', { class: 'field' }, ta));
    card.appendChild(h('div', { style: { display: 'flex', justifyContent: 'flex-end', marginTop: '10px' } },
      btn('Submit', 'btn-primary', () => { const v = ta.value.trim(); if (!v) return; pollVote(poll, v); })));
  }

  if (mine) {
    card.appendChild(h('div', { class: 'thanks', style: { marginTop: '16px', marginBottom: '14px' } },
      h('span', {}, '✓'), h('span', {}, 'Your response has been counted')));
    card.appendChild(h('div', { class: 'mini-results' }, renderResults(poll)));
  }
  return card;
}

function renderDisplay() {
  document.body.classList.add('display-mode');
  const quiz = state.quiz;
  const tab = urlTab || 'quiz';
  const root = h('div', { class: 'display-root' });

  const bar = h('div', { class: 'display-bar' });
  bar.appendChild(h('div', { class: 'display-brand' },
    h('div', { class: 'logo' }, logoSvg()),
    h('div', { class: 'brand-text' }, 'PC ', h('span', {}, 'Express'), ' Pulse')));
  bar.appendChild(h('button', { class: 'fs-float', style: { position: 'static', marginLeft: 'auto' }, onclick: toggleFullscreen }, '⛶ Fullscreen (F5)'));
  bar.appendChild(h('div', { class: 'display-room' },
    h('span', { class: 'lbl' }, 'Room'), h('span', { class: 'code' }, state.code)));
  if (quiz.status === 'running' && tab === 'quiz') bar.appendChild(h('div', { class: 'display-live' }, 'Live'));
  root.appendChild(bar);

  const body = h('div', { class: 'display-body' });

  if (tab === 'poll') {
    const livePolls = state.polls.filter(p => p.status === 'live');
    if (!livePolls.length) {
      body.classList.add('display-center');
      body.appendChild(h('div', { class: 'display-eyebrow' }, 'Live Poll'));
      body.appendChild(h('div', { class: 'display-wait-icon' }, '📊'));
      body.appendChild(h('h1', { class: 'display-h1' }, 'Waiting for the poll to start'));
      root.appendChild(body);
      return root;
    }
    const poll = livePolls[0];
    body.appendChild(h('div', { class: 'display-q' }, poll.question));
    const counts = new Array(poll.options.length).fill(0);
    poll.votes.forEach(v => { const i = Number(v.value); if (i >= 0 && i < counts.length) counts[i]++; });
    const totalVotes = poll.votes.length || 1;
    const opts = h('div', { class: 'display-options' });
    poll.options.forEach((opt, i) => {
      const pct = Math.round(counts[i] / totalVotes * 100);
      opts.appendChild(h('div', { class: 'display-opt' },
        h('div', { class: 'fill', style: { width: pct + '%' } }),
        h('div', { class: 'ltr' }, LETTERS[i]),
        h('div', { class: 'txt' }, opt),
        h('div', { class: 'cnt' }, counts[i]),
        h('div', { class: 'pct' }, pct + '%')));
    });
    body.appendChild(opts);
    root.appendChild(body);
    return root;
  }

  if (tab === 'qa') {
    body.appendChild(h('div', { class: 'display-eyebrow' }, 'Live Q&A'));
    body.appendChild(h('h1', { class: 'display-h1', style: { fontSize: 'clamp(24px,3.5vw,48px)' } }, 'Audience Questions'));
    const qs = [...state.qaList].sort((a, b) => {
      if (a.answered !== b.answered) return a.answered ? 1 : -1;
      return b.votes.length - a.votes.length;
    }).slice(0, 8);
    if (!qs.length) {
      body.appendChild(h('p', { class: 'display-lead' }, 'Waiting for the first question…'));
    } else {
      const grid = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '14px', width: '100%' } });
      qs.forEach((q, i) => {
        grid.appendChild(h('div', {
          style: {
            background: i === 0 ? 'linear-gradient(90deg,rgba(255,216,107,.2),rgba(245,166,35,.1))' : 'rgba(255,255,255,.06)',
            border: i === 0 ? '1px solid rgba(245,166,35,.5)' : '1px solid rgba(255,255,255,.1)',
            borderRadius: '14px', padding: '18px 24px', display: 'flex', alignItems: 'center', gap: '20px'
          }
        },
          h('div', { style: { fontSize: '28px', fontWeight: '900', color: i === 0 ? '#FFD86B' : '#7fb0ff', minWidth: '52px' } }, '▲' + q.votes.length),
          h('div', { style: { flex: 1, fontSize: 'clamp(16px,1.8vw,26px)', fontWeight: '800', color: '#fff', lineHeight: 1.3 } }, q.text)));
      });
      body.appendChild(grid);
    }
    root.appendChild(body);
    return root;
  }

  if (quiz.status === 'idle' || !quiz.questions.length) {
    body.classList.add('display-center');
    body.appendChild(h('div', { class: 'display-eyebrow' }, 'PC Express Product Knowledge Quiz'));
    body.appendChild(h('div', { class: 'display-wait-icon' }, '🎯'));
    body.appendChild(h('h1', { class: 'display-h1' }, 'Get ready — the quiz begins soon'));
    body.appendChild(h('p', { class: 'display-lead' }, 'Scan the QR code on screen to join.'));
    root.appendChild(body);
    return root;
  }

  if (quiz.status === 'finished') {
    const lb = getLeaderboard();
    body.classList.add('display-center');
    body.appendChild(h('div', { class: 'display-eyebrow' }, 'Quiz Complete'));
    body.appendChild(h('div', { class: 'display-wait-icon' }, '🏁'));
    body.appendChild(h('h1', { class: 'display-h1' }, 'Congratulations to our winners!'));
    if (lb.length) {
      const top = h('div', { style: { width: '100%', maxWidth: '960px', marginTop: '16px' } });
      const grid = h('div', { class: 'display-lb' });
      lb.slice(0, 8).forEach((row, i) => {
        grid.appendChild(h('div', { class: 'display-lb-row' + (i === 0 ? ' top1' : '') },
          h('div', { class: 'display-lb-rank' }, '#' + (i + 1)),
          h('div', { class: 'display-lb-name' }, row.name),
          h('div', { class: 'display-lb-correct' }, row.correct + ' correct'),
          h('div', { class: 'display-lb-score' }, row.score.toLocaleString())));
      });
      top.appendChild(grid);
      body.appendChild(top);
    }
    root.appendChild(body);
    return root;
  }

  const idx = quiz.currentIndex;
  const q = quiz.questions[idx];
  if (!q) { root.appendChild(body); return root; }
  const total = quiz.questions.length;
  const answered = q.votes.length;
  const participants = Math.max(participantCount(), answered);
  const revealed = q.status === 'revealed';
  const counts = new Array(q.options.length).fill(0);
  q.votes.forEach(v => { if (v.value >= 0 && v.value < counts.length) counts[v.value]++; });
  const totalVotes = q.votes.length || 1;

  const head = h('div', { class: 'display-qhead' });
  head.appendChild(h('div', { class: 'display-qbadge' }, 'Question ' + (idx + 1) + ' of ' + total));
  head.appendChild(h('div', { class: 'display-answered' }, h('span', { class: 'n' }, answered), h('span', {}, 'of ' + participants + ' answered')));
  if (q.status === 'active') {
    const timer = h('div', { class: 'display-timer' });
    const c = 2 * Math.PI * 40;
    const initPct = Math.max(0, (q.timeLimit - (Date.now() - q.startedAt) / 1000) / q.timeLimit);
    timer.appendChild(h('div', { class: 'num', 'data-timer-num': q.id }, Math.ceil(q.timeLimit * initPct)));
    timer.appendChild(h('div', { class: 'ring' },
      h('svg', { viewBox: '0 0 90 90' },
        h('circle', { class: 'track', cx: '45', cy: '45', r: '40' }),
        h('circle', { class: 'prog', cx: '45', cy: '45', r: '40', 'data-timer-ring': q.id,
          style: { strokeDasharray: c, strokeDashoffset: c * (1 - initPct) } }))));
    head.appendChild(timer);
  }
  body.appendChild(head);
  body.appendChild(h('div', { class: 'display-q' }, q.text));

  const opts = h('div', { class: 'display-options' });
  q.options.forEach((opt, i) => {
    const isCorrect = i === q.correctIndex;
    const pct = Math.round(counts[i] / totalVotes * 100);
    const classes = ['display-opt'];
    if (revealed && isCorrect) classes.push('correct', 'winner');
    if (revealed && !isCorrect && counts[i] > 0) classes.push('wrong');
    opts.appendChild(h('div', { class: classes.join(' ') },
      h('div', { class: 'fill', style: { width: (revealed || q.status === 'active' ? pct + '%' : '0%') } }),
      h('div', { class: 'ltr' }, LETTERS[i]),
      h('div', { class: 'txt' }, opt),
      h('div', { class: 'cnt' }, counts[i]),
      h('div', { class: 'pct' }, pct + '%')));
  });
  body.appendChild(opts);
  root.appendChild(body);
  return root;
}

async function saveComposer() {
  const c = composer;
  const q = c.question.trim();

function openQuizComposer(editIndex) {

  quizComposer = {
    editIndex: editing ? editIndex : null,
    text: base ? base.text : '',
    options: base ? [...base.options] : ['', '', '', ''],
    correctIndex: base ? base.correctIndex : 0,
    timeLimit: base ? base.timeLimit : 20
  };

function closeQuizComposer() { quizComposer = null; render(); }

function renderQuizComposer() {

  const root = h('div', { class: 'overlay', onclick: e => { if (e.target === root) closeQuizComposer(); } });
  const card = h('div', { class: 'modal' });
  card.appendChild(h('div', { class: 'modal-head' },
    h('h2', {}, c.editIndex !== null ? 'Edit question' : 'Add quiz question'),

      const wrap = h('div');
      c.options.forEach((o, i) => {

        row.appendChild(h('button', {
          class: 'correct-toggle' + (c.correctIndex === i ? ' on' : ''),
          onclick: () => { c.correctIndex = i; render(); }
        }, c.correctIndex === i ? '✓' : ''));
        row.appendChild(h('input', { class: 'input', value: o, placeholder: 'Option ' + LETTERS[i], maxlength: '80', oninput: e => { c.options[i] = e.target.value; } }));

      });

      h('output', { id: 'qcTimeVal' }, c.timeLimit + 's'))));

    btn(c.editIndex !== null ? 'Save changes' : 'Add question', 'btn-primary', saveQuizComposer)));
  card.appendChild(body); root.appendChild(card); return root;
}

async function saveQuizComposer() {
  const c = quizComposer;
  const text = c.text.trim();
  if (!text) { toast('Please enter the question'); return; }
  const options = c.options.map(o => o.trim()).filter(Boolean);
  if (options.length < 2) { toast('Add at least 2 options'); return; }
  if (c.correctIndex >= options.length) c.correctIndex = 0;

  if (c.editIndex !== null) {
    const q = state.quiz.questions[c.editIndex];
    q.text = text; q.options = options; q.correctIndex = c.correctIndex; q.timeLimit = c.timeLimit;
    if (q.supabaseId) {
      await db.from('questions').update({
        text, options, correct_index: c.correctIndex, time_limit: c.timeLimit
      }).eq('id', q.supabaseId);
    }
  } else {
    const newQ = {
      id: 'local-' + Date.now(), supabaseId: null,
      text, options, correctIndex: c.correctIndex, timeLimit: c.timeLimit,
      status: 'idle', startedAt: null, votes: []
    };
    state.quiz.questions.push(newQ);
    if (sessionId) {
      const { data } = await db.from('questions').insert({
        session_id: sessionId, position: state.quiz.questions.length - 1,
        text, options, correct_index: c.correctIndex, time_limit: c.timeLimit, status: 'idle'
      }).select().single();
      if (data) { newQ.id = data.id; newQ.supabaseId = data.id; }
    }
  }
  quizComposer = null; save(); render(); toast('Question saved');
}

/* ============================================================
   SET MANAGER
   ============================================================ */
function renderSetSelector() {
  const sel = document.getElementById('setSelect');
  if (!sel) return;
  const sets = getSets();
  const cur = getCurrentSetCode();
  sel.innerHTML = '';
  sets.forEach(s => {
    sel.appendChild(h('option', { value: s.code, selected: s.code === cur ? 'selected' : null }, s.title));
  });
}

async function switchSet(code) {
  if (code === getCurrentSetCode()) return;
  setCurrentSetCode(code);
  const sets = getSets();
  const set = sets.find(s => s.code === code);
  const withSamples = set ? !!set.seeded : false;

  state = makeSeed(code, withSamples);
  sessionId = null;
  if (channel) { db.removeChannel(channel); channel = null; }
  if (statePollHandle) { clearInterval(statePollHandle); statePollHandle = null; }
  save();
  supabaseReady = false;
  render();
  await initSupabase();
  renderSetSelector();
  toast('Switched to ' + code);
}

async function createNewSet() {
  const title = prompt('Name this question set:', 'Set ' + (getSets().length + 1));
  if (!title) return;
  const code = generateRoomCode();
  const sets = getSets();
  sets.push({ code, title, seeded: false, createdAt: Date.now() });
  saveSets(sets);
  /* Do NOT pre-set currentSetCode — switchSet handles it */
  await switchSet(code);
  toast('New set created — start adding questions');
}

async function deleteCurrentSet() {
  const sets = getSets();
  if (sets.length <= 1) { toast('Cannot delete the only set'); return; }
  const cur = getCurrentSetCode();
  const set = sets.find(s => s.code === cur);
  const title = set ? set.title : cur;
  if (!confirm('Delete set "' + title + '"?\n\nThis removes ALL questions, polls, Q&A, and participants for this set.')) return;

  try {
    const { data: sess } = await db.from('sessions').select('id').eq('code', cur).maybeSingle();
    if (sess) await db.from('sessions').delete().eq('id', sess.id);
  } catch (e) { console.error('[delete set]', e); }

  const remaining = sets.filter(s => s.code !== cur);
  saveSets(remaining);
  const nextCode = remaining[0].code;
  setCurrentSetCode(nextCode);

  const nextSet = remaining[0];
  state = makeSeed(nextCode, !!nextSet.seeded);
  sessionId = null;
  if (channel) { db.removeChannel(channel); channel = null; }
  if (statePollHandle) { clearInterval(statePollHandle); statePollHandle = null; }
  supabaseReady = false;
  save(); render();
  await initSupabase();
  renderSetSelector();
  toast('Set deleted');
}

const modalRoot = document.getElementById('modalRoot');

let nav = sessionStorage.getItem('pcx.pulse.nav') || 'polls';
const ui = { selectedPollId: null, selectedQuizIndex: 0, pickedAnswers: {}, leaderboardPopupDismissed: false };
let composer = null;
let quizComposer = null;

function render() {
  const active = document.activeElement;
  const focusId = active && active.id ? active.id : null;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const needFocus = !(active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA'));

  if (role === 'presenter' && !adminAuthenticated) {
    renderLogin();
    return;
  }
  document.body.classList.remove('login-mode');

  if (!supabaseReady) {
    document.body.classList.remove('display-mode', 'invite-mode');
    app.innerHTML = '';
    app.appendChild(h('div', { class: 'loading-state' },
      h('div', { class: 'spinner' }),
      h('p', {}, 'Connecting…'),
      h('span', {}, 'Setting up realtime sync')));
    return;
  }

  if (role === 'invite') {
    document.body.classList.add('invite-mode');
    document.body.classList.remove('display-mode');
    app.innerHTML = '';
    app.appendChild(renderInvitePage());
    modalRoot.innerHTML = '';
    return;
  }
  document.body.classList.remove('invite-mode');

  if (role === 'display') {
    document.body.classList.add('display-mode');
    app.innerHTML = '';
    app.appendChild(renderDisplay());
    modalRoot.innerHTML = '';
    return;
  }
  document.body.classList.remove('display-mode');

  const seg = document.getElementById('roleSeg');
  const lock = document.getElementById('lockBadge');
  const setSel = document.getElementById('setSelect');
  const newSetBtn = document.getElementById('newSetBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const deleteSetBtn = document.getElementById('deleteSetBtn');

  if (roleLocked) {
    if (seg) seg.style.display = 'none';
    if (lock) lock.style.display = 'inline-flex';
    if (lock) lock.textContent = role === 'participant' ? '🔒 Participant' : '🔒 Presenter';
    if (setSel) setSel.style.display = 'none';
    if (newSetBtn) newSetBtn.style.display = 'none';
    if (logoutBtn) logoutBtn.style.display = 'none';
    if (deleteSetBtn) deleteSetBtn.style.display = 'none';
  } else {
    if (seg) seg.style.display = 'none';
    if (lock) lock.style.display = 'none';
    if (setSel) setSel.style.display = '';
    if (newSetBtn) newSetBtn.style.display = '';
    if (logoutBtn) logoutBtn.style.display = '';
    if (deleteSetBtn) deleteSetBtn.style.display = (getSets().length > 1) ? '' : 'none';
  }
  document.getElementById('roomCodeBtn').textContent = state.code;
  renderSetSelector();

  if (role === 'participant') {
    app.innerHTML = '';
    app.appendChild(participantQuiz());
    modalRoot.innerHTML = '';
    if (state.quiz.status === 'finished' && !ui.leaderboardPopupDismissed) {
      modalRoot.appendChild(renderLeaderboardPopup());
    }
    if (focusId && !needFocus) {
      const el = document.getElementById(focusId);
      if (el) { el.focus(); if (selStart !== null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selStart); } catch(e){} } }
    }
    return;
  }

  if (state.quiz.status === 'running' && nav !== 'quiz') nav = 'quiz';

  app.innerHTML = '';
  app.appendChild(renderSubnav());

  if (nav === 'polls') app.appendChild(presenterPolls());
  else if (nav === 'quiz') app.appendChild(presenterQuiz());
  else app.appendChild(presenterQa());

  modalRoot.innerHTML = '';
  if (composer) modalRoot.appendChild(renderComposer());
  else if (quizComposer) modalRoot.appendChild(renderQuizComposer());

  if (focusId && !needFocus) {
    const el = document.getElementById(focusId);
    if (el) { el.focus(); if (selStart !== null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selStart); } catch(e){} } }
  }
}

function renderSubnav() {
  const activeQuiz = state.quiz.status === 'running';
  const navBar = h('nav', { class: 'subnav' });
  [{ id: 'polls', label: '📊 Polls' },
   { id: 'quiz', label: '🎯 Quiz', dot: activeQuiz },
   { id: 'qa', label: '💬 Q&A' }].forEach(item => {
    const b = h('button', {
      class: nav === item.id ? 'active' : '',
      onclick: () => { nav = item.id; sessionStorage.setItem('pcx.pulse.nav', nav); render(); }
    }, item.label);
    if (item.dot) b.appendChild(h('span', { class: 'dot' }));
    navBar.appendChild(b);
  });
  return navBar;
}

/* ============================================================
   EVENTS
   ============================================================ */
document.getElementById('roomCodeBtn').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(state.code); toast('Room code copied'); }
  catch (e) { toast('Room code: ' + state.code); }
});

document.getElementById('newSetBtn').addEventListener('click', createNewSet);
document.getElementById('deleteSetBtn').addEventListener('click', deleteCurrentSet);
document.getElementById('logoutBtn').addEventListener('click', () => {
  if (!confirm('Log out?')) return;
  adminAuthenticated = false;
  sessionStorage.removeItem(ADMIN_KEY);
  render();
});
document.getElementById('setSelect').addEventListener('change', (e) => switchSet(e.target.value));

/* ============================================================
   INIT
   ============================================================ */
ensureDefaultSet();
state.code = getCurrentSetCode();
render();
ensureTimerLoop();
initSupabase();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Express Pulse — Live polls, quiz & Q&A</title>
<style>
/* ===================== BASE ===================== */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#0f1720; --muted:#6b7580;
  --line:#e3e8ee; --brand:#E31E24; --brand-dk:#B8141A; --brand-soft:#FCE8E9;
  --pc-blue:#0033A0; --pc-blue-soft:#E6ECF8; --pc-blue-dk:#002270;
  --ok:#0a8a6e; --ok-soft:#E4F8F1;
  --warn:#F59E0B;
  --radius:12px;
  --shadow:0 2px 4px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;letter-spacing:-.02em}
button{font:inherit}
::selection{background:#FCE8E9;color:#B8141A}
body.display-mode{background:#001a4d;overflow-x:hidden}
body.display-mode .topbar, body.display-mode .subnav{display:none}
body.invite-mode .topbar, body.invite-mode .subnav{display:none}
body.invite-mode{background:#f4f6f9}

/* ===================== TOPBAR ===================== */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;
  padding:12px 20px;background:rgba(255,255,255,.95);backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:3px solid var(--pc-blue)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:-.04em;font-style:italic}
.logo{width:34px;height:34px;border-radius:6px;background:linear-gradient(135deg,var(--brand) 0%,var(--brand-dk) 100%);
  display:grid;place-items:center;color:#fff;box-shadow:0 4px 10px rgba(227,30,36,.3);transform:skew(-6deg)}
.logo svg{width:18px;height:18px;display:block;transform:skew(6deg)}
.brand-text{color:var(--pc-blue);text-transform:uppercase}
.brand-text span{color:var(--brand)}
.room{margin-left:auto;display:flex;align-items:center;gap:9px;padding:5px 6px 5px 14px;
  border-radius:6px;background:#F0F2F5;border:1px solid var(--line)}
.room-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pc-blue)}
.room-code{border:0;background:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;
  font-weight:900;font-size:15px;letter-spacing:.1em;color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.07);transition:.15s}
.room-code:hover{background:var(--brand);color:#fff}
.seg{display:flex;background:#E6ECF8;border-radius:6px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:4px;font-size:13px;font-weight:700;
  color:var(--pc-blue);cursor:pointer;transition:.16s;text-transform:uppercase;letter-spacing:.02em}
.seg button.active{background:var(--pc-blue);color:#fff;box-shadow:0 2px 4px rgba(0,51,160,.2)}
.lock-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;
  background:var(--brand-soft);color:var(--brand-dk);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}

/* ===================== SUBNAV ===================== */
.subnav{display:flex;gap:6px;padding:12px 20px 0;max-width:1400px;margin:0 auto;overflow-x:auto}
.subnav button{border:0;background:transparent;padding:10px 18px;border-radius:8px 8px 0 0;
  font-size:14px;font-weight:800;color:var(--pc-blue);cursor:pointer;transition:.15s;
  text-transform:uppercase;letter-spacing:.03em;position:relative;display:flex;align-items:center;gap:8px;white-space:nowrap}
.subnav button:hover{background:#EEF2FA}
.subnav button.active{background:#fff;border:1px solid var(--line);border-bottom-color:#fff;color:var(--brand);
  box-shadow:0 -2px 0 var(--brand) inset}
.subnav .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);animation:pulse 1.6s infinite}

/* ===================== LAYOUT ===================== */
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;
  padding:0 20px 20px;max-width:1400px;margin:0 auto;align-items:start}
.page.narrow{max-width:800px;margin:0 auto;padding:0 20px 20px;display:flex;flex-direction:column;gap:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:0 var(--radius) var(--radius) var(--radius);box-shadow:var(--shadow)}
.panel.pad{padding:24px;border-radius:var(--radius)}
.side{overflow:hidden;border-top:4px solid var(--brand);border-radius:var(--radius)}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.side-head h2{font-size:15px;font-weight:800;color:var(--pc-blue);text-transform:uppercase;letter-spacing:.02em}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.section-head h2{font-size:18px;font-weight:800;color:var(--pc-blue)}
.pill{margin-left:auto;font-size:12px;font-weight:800;color:#fff;background:var(--brand);
  padding:5px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
.pill.blue{background:var(--pc-blue)}

/* ===================== BUTTONS ===================== */
.btn{border:0;border-radius:6px;padding:10px 18px;font-size:13.5px;font-weight:800;cursor:pointer;
  transition:.16s;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:4px}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 3px 8px rgba(227,30,36,.25)}
.btn-primary:hover:not(:disabled){background:var(--brand-dk)}
.btn-blue{background:var(--pc-blue);color:#fff;box-shadow:0 3px 8px rgba(0,51,160,.25)}
.btn-blue:hover:not(:disabled){background:var(--pc-blue-dk)}
.btn-ok{background:var(--ok);color:#fff}
.btn-ok:hover:not(:disabled){background:#076b56}
.btn-ghost{background:#F0F2F5;color:var(--pc-blue);border:1px solid var(--line)}
.btn-ghost:hover:not(:disabled){background:#E6ECF8}
.btn-ghost.danger{color:var(--brand)}
.btn-ghost.danger:hover{background:var(--brand-soft);border-color:#f7cdce}
.icon-btn{border:0;background:transparent;width:32px;height:32px;border-radius:6px;cursor:pointer;
  color:var(--muted);font-size:15px;display:grid;place-items:center;transition:.15s}
.icon-btn:hover{background:#E6ECF8;color:var(--pc-blue)}
.icon-btn.danger:hover{background:var(--brand-soft);color:var(--brand)}

/* ===================== POLL LIST ===================== */
.poll-list{padding:12px;display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}
.poll-item{text-align:left;border:1.5px solid transparent;background:#F8FAFC;border-radius:8px;
  padding:14px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:9px;width:100%}
.poll-item:hover{background:#F0F4F8;border-color:#D1D9E6}
.poll-item.selected{background:var(--pc-blue-soft);border-color:var(--pc-blue)}
.poll-item-q{font-size:14px;font-weight:700;line-height:1.4;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.poll-item-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted-sm{font-size:11.5px;color:var(--muted);font-weight:700}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  background:#E6ECF8;color:var(--pc-blue);padding:4px 9px;border-radius:4px}
.status{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 9px;border-radius:4px;display:inline-flex;align-items:center;gap:6px}
.status.draft{background:#F0F2F5;color:#7A848F}
.status.live{background:var(--brand-soft);color:var(--brand)}
.status.live::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--brand);animation:pulse 1.6s infinite}
.status.closed{background:var(--pc-blue-soft);color:var(--pc-blue)}
.status.idle{background:#F0F2F5;color:#7A848F}
.status.active{background:var(--brand-soft);color:var(--brand)}
.status.active::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--brand);animation:pulse 1.6s infinite}
.status.revealed{background:var(--ok-soft);color:var(--ok)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}

/* ===================== STAGE ===================== */
.stage{padding:30px;min-height:540px;display:flex;flex-direction:column}
.stage-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.stage-head .spacer{flex:1}
.stage-q{font-size:clamp(22px,2.5vw,32px);font-weight:900;line-height:1.2;margin-bottom:8px;color:var(--pc-blue)}
.stage-sub{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:30px;text-transform:uppercase;letter-spacing:.04em}

/* ===================== RESULTS ===================== */
.results{display:flex;flex-direction:column;gap:16px;margin-top:auto}
.bar{display:flex;flex-direction:column;gap:8px}
.bar-top{display:flex;align-items:baseline;gap:12px;font-size:15px}
.bar-label{font-weight:700;flex:1;min-width:0}
.bar-val{font-weight:800;font-variant-numeric:tabular-nums;color:var(--pc-blue);font-size:14px}
.bar-track{height:42px;background:#F0F2F5;border-radius:6px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--pc-blue),#1A5CFF);
  transform-origin:left;animation:grow .5s cubic-bezier(.2,.85,.25,1)}
.bar:nth-child(2) .bar-fill{background:linear-gradient(90deg,var(--brand),#FF4D4D)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.avg{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.avg strong{font-size:42px;font-weight:900;letter-spacing:-.04em;color:var(--brand)}
.avg span{font-size:14px;color:var(--muted);font-weight:700;text-transform:uppercase}
.cloud{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:center;
  padding:40px 10px;min-height:240px}
.cloud-word{font-weight:900;line-height:1;letter-spacing:-.03em;animation:popin .4s backwards;font-style:italic}
@keyframes popin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.responses{display:flex;flex-direction:column;gap:12px;max-height:360px;overflow:auto;padding-right:6px}
.response{background:#F8FAFC;border:1px solid var(--line);border-radius:8px;padding:14px 16px;
  font-size:14.5px;line-height:1.5;animation:popin .3s;font-weight:500}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:20px;font-weight:600}
.empty-state{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 20px;text-align:center}
.empty-icon{font-size:40px}
.empty-state p{margin:0;font-weight:800;font-size:16px;color:var(--pc-blue)}
.empty-state span{font-size:14px;color:var(--muted);font-weight:500}

/* ===================== QUIZ ===================== */
.quiz-head{padding:20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.quiz-head h2{font-size:18px;font-weight:900;color:var(--pc-blue);flex:1;min-width:0}
.quiz-meta{display:flex;gap:16px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;flex-wrap:wrap}
.quiz-meta b{color:var(--pc-blue)}

.q-list{padding:10px;display:flex;flex-direction:column;gap:6px;max-height:65vh;overflow:auto}
.q-list-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;cursor:pointer;
  background:#F8FAFC;border:1.5px solid transparent;transition:.15s}
.q-list-item:hover{background:#F0F4F8;border-color:#D1D9E6}
.q-list-item.selected{background:var(--pc-blue-soft);border-color:var(--pc-blue)}
.q-num{width:28px;height:28px;border-radius:6px;background:var(--pc-blue);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:900;flex:none}
.q-list-item.revealed .q-num{background:var(--ok)}
.q-list-item.active .q-num{background:var(--brand);animation:pulse 1.6s infinite}
.q-text{flex:1;min-width:0;font-size:13.5px;font-weight:700;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q-answered{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}

.quiz-stage{padding:30px;display:flex;flex-direction:column;gap:24px;min-height:540px}
.q-header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.q-badge{background:var(--pc-blue);color:#fff;padding:6px 14px;border-radius:6px;
  font-size:13px;font-weight:900;letter-spacing:.04em}
.q-timer{display:flex;align-items:center;gap:10px;margin-left:auto}
.timer-num{font-size:22px;font-weight:900;color:var(--pc-blue);font-variant-numeric:tabular-nums;min-width:54px;text-align:right}
.timer-num.low{color:var(--brand)}
.timer-bar-track{width:120px;height:8px;background:#E6ECF8;border-radius:4px;overflow:hidden}
.timer-bar{height:100%;background:var(--pc-blue);border-radius:4px;transition:width .25s linear}
.timer-bar.low{background:var(--brand)}
.q-answered-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;
  background:var(--brand-soft);color:var(--brand-dk);font-size:13px;font-weight:800}
.q-answered-pill .n{font-size:16px;font-weight:900}

.quiz-question{font-size:clamp(22px,2.8vw,34px);font-weight:900;line-height:1.2;color:var(--ink)}

.quiz-options{display:flex;flex-direction:column;gap:12px}
.quiz-opt{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:10px;
  border:2px solid var(--line);background:#fff;transition:.2s;position:relative;overflow:hidden}
.quiz-opt .opt-letter{width:34px;height:34px;border-radius:8px;background:var(--pc-blue-soft);color:var(--pc-blue);
  display:grid;place-items:center;font-size:14px;font-weight:900;flex:none;z-index:1}
.quiz-opt .opt-text{flex:1;font-size:16px;font-weight:700;z-index:1}
.quiz-opt .opt-count{font-size:15px;font-weight:900;color:var(--pc-blue);z-index:1;font-variant-numeric:tabular-nums}
.quiz-opt .opt-bar{position:absolute;left:0;top:0;bottom:0;background:var(--pc-blue-soft);z-index:0;transition:width .4s}
.quiz-opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.quiz-opt.correct .opt-letter{background:var(--ok);color:#fff}
.quiz-opt.correct .opt-bar{background:rgba(10,138,110,.15)}
.quiz-opt.wrong{border-color:#f0b5b6;background:#fff5f5}
.quiz-opt.wrong .opt-bar{background:rgba(227,30,36,.1)}
.quiz-opt.mine{box-shadow:0 0 0 2px var(--brand) inset}
.quiz-opt.pickable{cursor:pointer}
.quiz-opt.pickable:hover{border-color:var(--pc-blue)}

.quiz-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.quiz-actions .spacer{flex:1}

.winner-card{background:linear-gradient(135deg,#FFF8E6,#FFF1CC);border:2px solid #F5D97A;
  border-radius:12px;padding:18px 22px;display:flex;align-items:center;gap:16px}
.winner-card .trophy{font-size:34px}
.winner-card .w-info{flex:1}
.winner-card .w-title{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#8A6B00;margin-bottom:4px}
.winner-card .w-name{font-size:20px;font-weight:900;color:#5C4600}
.winner-card .w-stats{font-size:13px;font-weight:700;color:#8A6B00;margin-top:2px}
.winner-card .w-points{font-size:24px;font-weight:900;color:var(--brand)}

.participant-pill{padding:10px 16px;background:var(--pc-blue-soft);border-radius:8px;font-size:13px;font-weight:800;color:var(--pc-blue)}
.participant-pill b{color:var(--brand)}

/* ===================== LEADERBOARD ===================== */
.lb{display:flex;flex-direction:column;gap:6px}
.lb-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:8px;background:#F8FAFC}
.lb-row.you{background:var(--brand-soft);border:1px solid #F5C2C4}
.lb-row.top1{background:linear-gradient(90deg,#FFF8E6,#FFF1CC);border:1px solid #F5D97A}
.lb-rank{width:32px;height:32px;border-radius:8px;background:var(--pc-blue);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:900;flex:none}
.lb-row.top1 .lb-rank{background:var(--brand)}
.lb-name{flex:1;font-size:14px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-correct{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.lb-score{font-size:16px;font-weight:900;color:var(--pc-blue);font-variant-numeric:tabular-nums;white-space:nowrap}
.lb-row.top1 .lb-score{color:var(--brand)}

/* ===================== PARTICIPANT POLLS ===================== */
.poll-card{border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px;background:#fff;
  animation:popin .3s;border-left:4px solid var(--brand)}
.poll-card:last-child{margin-bottom:0}
.poll-card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.poll-card-q{font-size:18px;font-weight:800;line-height:1.3;margin-bottom:20px;color:var(--pc-blue)}
.options{display:flex;flex-direction:column;gap:10px}
.option{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid var(--line);
  background:#fff;border-radius:8px;padding:15px 18px;font-size:15px;font-weight:700;cursor:pointer;
  transition:.16s;color:var(--ink)}
.option:hover{border-color:var(--pc-blue);background:#F8FAFC}
.option.chosen{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dk)}
.opt-mark{width:20px;height:20px;border-radius:50%;border:2px solid #CBD5E1;flex:none;transition:.16s}
.option.chosen .opt-mark{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 4px #fff}
.rating-row{display:flex;gap:12px}
.rate-btn{flex:1;aspect-ratio:1;max-width:68px;border:2px solid var(--line);background:#fff;
  border-radius:8px;font-size:18px;font-weight:800;cursor:pointer;transition:.16s;color:var(--ink)}
.rate-btn:hover{border-color:var(--pc-blue);background:#F8FAFC}
.rate-btn.chosen{border-color:var(--brand);background:var(--brand);color:#fff}
.rating-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);
  font-weight:700;margin-top:10px;max-width:360px;text-transform:uppercase}
.ask-row{display:flex;gap:10px;margin-bottom:18px}
.input{flex:1;min-width:0;border:2px solid var(--line);border-radius:8px;padding:12px 16px;
  font:inherit;font-size:15px;background:#fff;color:var(--ink);transition:.16s;outline:none;font-weight:500}
.input:focus{border-color:var(--pc-blue);box-shadow:0 0 0 4px var(--pc-blue-soft)}
textarea.input{resize:vertical;min-height:90px;line-height:1.5}
.thanks{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:800;color:var(--brand-dk);
  background:var(--brand-soft);padding:12px 18px;border-radius:8px;margin-bottom:18px;border:1px solid #F5C2C4}
.mini-results{margin-top:6px}

/* ===================== Q&A ===================== */
.qa-list{display:flex;flex-direction:column;gap:12px}
.qa-item{display:flex;gap:16px;align-items:flex-start;padding:16px;border-radius:10px;
  background:#F8FAFC;border:1.5px solid transparent;transition:.15s}
.qa-item:hover{background:#F0F4F8;border-color:#D1D9E6}
.qa-item.answered{opacity:.6;background:#F4F6F9}
.qa-item.answered .qa-text{text-decoration:line-through;text-decoration-color:#94A3B8}
.upvote{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none;
  border:2px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;
  cursor:pointer;font-size:13px;font-weight:800;color:var(--pc-blue);transition:.16s;min-width:54px}
.upvote:hover{border-color:var(--pc-blue);background:var(--pc-blue-soft)}
.upvote.voted{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dk)}
.caret{font-size:10px;line-height:1}
.qa-body{flex:1;min-width:0}
.qa-text{font-size:15px;font-weight:700;line-height:1.45;word-break:break-word;color:var(--ink)}
.qa-meta{font-size:12px;color:var(--muted);font-weight:700;margin-top:6px;text-transform:uppercase}
.qa-acts{display:flex;gap:4px;flex:none}

/* ===================== MODAL ===================== */
.overlay{position:fixed;inset:0;background:rgba(15,23,32,.6);backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);display:grid;place-items:center;z-index:200;padding:24px;animation:fade .2s;overflow:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:16px;width:min(620px,100%);max-height:92vh;overflow:auto;

<script>
/* ============================================================
   CONSTANTS & UTILITIES
   ============================================================ */
const KEY = 'pcx.pulse.state.v6';
const NAME_KEY = 'pcx.pulse.name';
const uid = () => Math.random().toString(36).slice(2, 9);

/* --- URL PARAMS --- */
const urlParams = new URLSearchParams(location.search);
const urlRoom = urlParams.get('room');
const urlRole = urlParams.get('role');
const urlDisplay = urlParams.get('display');
const urlInvite = urlParams.get('invite');

let roleLocked = false;
let role;

if (urlInvite === '1') {
  role = 'invite';
  roleLocked = true;
} else if (urlDisplay === '1') {
  role = 'display';
  roleLocked = true;
} else if (urlRoom) {
  role = 'participant';
  roleLocked = true;
} else if (urlRole === 'presenter') {
  role = 'presenter';
  roleLocked = true;
} else {
  role = sessionStorage.getItem('pcx.pulse.role') || 'presenter';
}

const myId = (() => {
  let v = localStorage.getItem('pcx.pulse.voter');
  if (!v) { v = uid(); localStorage.setItem('pcx.pulse.voter', v); }
  return v;
})();

const TYPE_LABEL = { multiple_choice:'Multiple choice', word_cloud:'Word cloud', open_text:'Open text', rating:'Rating' };
const STATUS_LABEL = { draft:'Draft', live:'Live', closed:'Closed' };
const CLOUD_COLORS = ['#E31E24','#0033A0','#E31E24','#0033A0','#6B7280','#B8141A','#002270'];
const LETTERS = ['A','B','C','D','E','F'];

/* ============================================================
   SEED DATA
   ============================================================ */
function makeQuiz() {
  const qs = [
    { id: uid(), text: 'Which GPU brand is known for DLSS technology?',
      options: ['NVIDIA', 'AMD', 'Intel', 'Qualcomm'], correctIndex: 0, timeLimit: 20,
      status: 'idle', startedAt: null, votes: [] },
    { id: uid(), text: 'What does "SSD" stand for in storage?',
      options: ['Solid State Drive', 'Super Speed Disk', 'Secure Storage Device', 'Silicon Static Drive'],
      correctIndex: 0, timeLimit: 15, status: 'idle', startedAt: null, votes: [] },
    { id: uid(), text: 'Which PC Express service lets you get a build delivered same-day?',
      options: ['Express Delivery', 'Standard Shipping', 'Store Pickup', 'Courier Plus'],
      correctIndex: 0, timeLimit: 20, status: 'idle', startedAt: null, votes: [] },
    { id: uid(), text: 'What is the typical response time of a high-refresh gaming monitor?',
      options: ['1 ms', '16 ms', '50 ms', '100 ms'], correctIndex: 0, timeLimit: 15,
      status: 'idle', startedAt: null, votes: [] },
    { id: uid(), text: 'Which component is the "brain" of a PC?',
      options: ['CPU', 'RAM', 'GPU', 'PSU'], correctIndex: 0, timeLimit: 10,
      status: 'idle', startedAt: null, votes: [] }
  ];
  return { title: 'PC Express Product Knowledge Quiz', status: 'idle', currentIndex: -1, questions: qs };
}

function makeSeed() {
  const p1 = { id: uid(), type: 'multiple_choice', question: 'Which PC Express service matters most to you?',
    options: ['Fast Delivery', 'Competitive Pricing', 'Warranty Support', 'Product Availability'],
    status: 'live', votes: [] };
  [42, 18, 25, 15].forEach((w, i) => { for (let k = 0; k < Math.round(w / 4); k++) p1.votes.push({ voter: uid(), value: i }); });

/* ============================================================
   DOM HELPERS
   ============================================================ */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'value') el.value = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
      else el.setAttribute(k, v);
    }
  }
  kids.flat(Infinity).forEach(k => {
    if (k === null || k === undefined || k === false) return;
    el.appendChild(typeof k === 'object' ? k : document.createTextNode(String(k)));
  });
  return el;
}
const btn = (label, cls, fn) => h('button', { class: 'btn ' + cls, onclick: fn }, label);

function toast(msg) {
  const root = document.getElementById('toastRoot');
  const t = h('div', { class: 'toast' }, msg);
  root.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'opacity .3s, transform .3s';
    t.style.opacity = '0';
    t.style.transform = 'translateY(10px)';
    setTimeout(() => t.remove(), 320);
  }, 1800);
}

function relTime(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return s + 's ago';
  return Math.round(s / 60) + 'm ago';
}

function logoSvg() {

    'stroke-linecap': 'round', 'stroke-linejoin': 'round' },

}

/* ============================================================
   QUIZ LOGIC
   ============================================================ */
function scoreFor(q, timestamp) {
  const elapsed = (timestamp - q.startedAt) / 1000;
  const remaining = Math.max(0, q.timeLimit - elapsed);
  return 1000 + Math.round((remaining / q.timeLimit) * 500);
}

function submitQuizAnswer(q, value) {
  if (q.status !== 'active' || !q.startedAt) return;
  if (q.votes.find(v => v.voter === myId)) return;
  const timestamp = Date.now();
  const name = getParticipantName() || 'Anonymous';
  if (!state.participants[myId]) state.participants[myId] = { id: myId, name, joinedAt: timestamp };
  const score = (value === q.correctIndex) ? scoreFor(q, timestamp) : 0;
  q.votes.push({ voter: myId, name, value, timestamp, score });
  save(); render();
  toast(value === q.correctIndex ? 'Correct! +' + score + ' pts' : 'Answer submitted');
}

function startQuiz() {
  if (!state.quiz.questions.length) { toast('Add questions first'); return; }
  state.quiz.status = 'running';
  state.quiz.currentIndex = 0;
  state.quiz.questions.forEach(q => { q.status = 'idle'; q.startedAt = null; q.votes = []; });
  activateQuestion(0);
  save(); render();
  toast('Quiz started — Question 1 is live!');
}

function activateQuestion(index) {
  const q = state.quiz.questions[index];
  if (!q) return;
  q.status = 'active'; q.startedAt = Date.now(); q.votes = [];
  state.quiz.currentIndex = index;
  save();
}

function revealQuestion(q) { if (q) { q.status = 'revealed'; save(); render(); } }

function nextQuestion() {
  const idx = state.quiz.currentIndex;
  const q = state.quiz.questions[idx];
  if (q && q.status === 'active') { toast('Reveal the answer first'); return; }
  if (idx + 1 >= state.quiz.questions.length) {
    state.quiz.status = 'finished'; save(); render(); toast('Quiz finished!'); return;
  }
  activateQuestion(idx + 1);
  ui.selectedQuizIndex = idx + 1;
  render();
}

function resetQuiz() {
  state.quiz.status = 'idle';
  state.quiz.currentIndex = -1;
  state.quiz.questions.forEach(q => { q.status = 'idle'; q.startedAt = null; q.votes = []; });
  state.participants = {};
  save(); render(); toast('Quiz reset');
}

function fastestCorrect(q) {
  if (!q || q.status !== 'revealed') return null;
  const correct = q.votes.filter(v => v.value === q.correctIndex);
  if (!correct.length) return null;
  return correct.slice().sort((a, b) => a.timestamp - b.timestamp)[0];
}

function getLeaderboard() {
  const map = {};
  state.quiz.questions.forEach(q => {
    q.votes.forEach(v => {
      if (!map[v.voter]) map[v.voter] = { voter: v.voter, name: v.name, score: 0, correct: 0, answered: 0 };
      map[v.voter].score += v.score || 0;
      map[v.voter].answered++;
      if (q.status === 'revealed' && v.value === q.correctIndex) map[v.voter].correct++;
    });
  });
  return Object.values(map).sort((a, b) => b.score - a.score || b.correct - a.correct);
}

function vote(poll, value) {
  const existing = poll.votes.find(v => v.voter === myId);
  if (existing) existing.value = value;
  else poll.votes.push({ voter: myId, value });
  save(); render(); toast('Vote counted');
}
function setStatus(poll, status) { poll.status = status; save(); render(); toast('Poll updated'); }
function ask(text) { state.questions.push({ id: uid(), text, votes: [], answered: false }); save(); render(); toast('Question submitted'); }
function toggleUpvote(q) {
  const i = q.votes.indexOf(myId);
  if (i >= 0) q.votes.splice(i, 1); else q.votes.push(myId);
  save(); render();
}
function simulateVotes(poll) {
  const n = poll.type === 'multiple_choice' ? poll.options.length : poll.type === 'rating' ? 5 : 0;
  if (n) for (let i = 0; i < 6; i++) poll.votes.push({ voter: uid(), value: Math.floor(Math.random() * n) });
  else if (poll.type === 'word_cloud') {
    const pool = ['fast','secure','reliable','cheap','helpful','smooth','excellent'];
    for (let i = 0; i < 5; i++) poll.votes.push({ voter: uid(), value: pool[Math.floor(Math.random() * pool.length)] });
  } else {
    const pool = ['Loved the fast delivery.','Could improve packaging.','Great customer service.'];
    for (let i = 0; i < 4; i++) poll.votes.push({ voter: uid(), value: pool[Math.floor(Math.random() * pool.length)] });
  }
  save(); render(); toast('Simulated votes');
}

/* ============================================================
   TIMER LOOP
   ============================================================ */
let timerHandle = null;
function ensureTimerLoop() { if (!timerHandle) timerHandle = setInterval(tickTimer, 200); }
function tickTimer() {
  const now = Date.now();
  let needsRender = false;
  state.quiz.questions.forEach(q => {
    if (q.status !== 'active' || !q.startedAt) return;
    const elapsed = (now - q.startedAt) / 1000;
    const remaining = Math.max(0, q.timeLimit - elapsed);
    const low = remaining <= 5;

    document.querySelectorAll(`[data-timer="${q.id}"]`).forEach(el => {
      el.textContent = Math.ceil(remaining) + 's';
      el.classList.toggle('low', low);
    });
    document.querySelectorAll(`[data-timer-bar="${q.id}"]`).forEach(el => {
      el.style.width = (remaining / q.timeLimit * 100) + '%';
      el.classList.toggle('low', low);
    });
    document.querySelectorAll(`[data-timer-ring="${q.id}"]`).forEach(el => {
      const pct = remaining / q.timeLimit;
      const circumference = 2 * Math.PI * 40;
      el.style.strokeDasharray = circumference;
      el.style.strokeDashoffset = circumference * (1 - pct);
      el.classList.toggle('low', low);
    });
    document.querySelectorAll(`[data-timer-num="${q.id}"]`).forEach(el => {
      el.textContent = Math.ceil(remaining);
      el.classList.toggle('low', low);
    });

    if (remaining <= 0) { q.status = 'revealed'; save(); needsRender = true; }
  });
  /* Refresh relative times on invite page */
  if (role === 'invite') {
    document.querySelectorAll('[data-rel-time]').forEach(el => {
      const ts = Number(el.dataset.relTime);
      if (ts) el.textContent = relTime(ts);
    });
  }
  if (needsRender) render();
}

function renderResults(poll) {
  const box = h('div', { class: 'results' });
  const total = poll.votes.length;
  if (poll.type === 'multiple_choice' || poll.type === 'rating') {
    const labels = poll.type === 'rating' ? ['1','2','3','4','5'] : poll.options;
    const counts = new Array(labels.length).fill(0);
    poll.votes.forEach(v => { const i = Number(v.value); if (i >= 0 && i < counts.length) counts[i]++; });
    if (poll.type === 'rating' && total) {
      const avg = poll.votes.reduce((s, v) => s + (Number(v.value) + 1), 0) / total;
      box.appendChild(h('div', { class: 'avg' }, h('strong', {}, avg.toFixed(1)), h('span', {}, 'Average Rating')));
    }
    labels.forEach((label, i) => {
      const pct = total ? Math.round(counts[i] / total * 100) : 0;
      box.appendChild(h('div', { class: 'bar' },
        h('div', { class: 'bar-top' }, h('span', { class: 'bar-label' }, label), h('span', { class: 'bar-val' }, pct + '%  ·  ' + counts[i])),
        h('div', { class: 'bar-track' }, h('div', { class: 'bar-fill', style: { width: pct + '%' } }))));
    });
  } else if (poll.type === 'word_cloud') {
    const map = new Map();
    poll.votes.forEach(v => { const w = String(v.value).trim().toLowerCase(); if (!w) return; map.set(w, (map.get(w) || 0) + 1); });
    const entries = [...map.entries()].sort((a, b) => b[1] - a[1]);
    const cloud = h('div', { class: 'cloud' });
    if (!entries.length) cloud.appendChild(h('p', { class: 'empty' }, 'No responses yet'));
    else {
      const max = entries[0][1];
      entries.forEach(([w, c], i) => cloud.appendChild(h('span', {
        class: 'cloud-word',
        style: { fontSize: (18 + (c / max) * 38) + 'px', color: CLOUD_COLORS[i % CLOUD_COLORS.length], animationDelay: (i * 35) + 'ms' }
      }, w)));
    }
    box.appendChild(cloud);
  } else {
    const list = h('div', { class: 'responses' });
    if (!poll.votes.length) list.appendChild(h('p', { class: 'empty' }, 'No responses yet'));
    else poll.votes.slice().reverse().forEach(v => list.appendChild(h('div', { class: 'response' }, String(v.value))));
    box.appendChild(list);
  }
  return box;
}

/* ============================================================
   RENDER — QUIZ QUESTION
   ============================================================ */
function renderQuizQuestion(q, idx, isPresenter) {
  const wrap = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '22px' } });
  const total = state.quiz.questions.length;
  const answered = q.votes.length;
  const participants = Math.max(participantCount(), answered);
  const revealed = q.status === 'revealed';
  const mineVote = q.votes.find(v => v.voter === myId);

  const header = h('div', { class: 'q-header' });
  header.appendChild(h('div', { class: 'q-badge' }, 'Question ' + (idx + 1) + ' of ' + total));
  if (q.status === 'active') {
    const timer = h('div', { class: 'q-timer' });
    timer.appendChild(h('div', { class: 'timer-bar-track' }, h('div', {
      class: 'timer-bar', 'data-timer-bar': q.id,
      style: { width: (Math.max(0, (q.timeLimit - (Date.now() - q.startedAt) / 1000) / q.timeLimit * 100)) + '%' } })));
    timer.appendChild(h('div', { class: 'timer-num', 'data-timer': q.id }, q.timeLimit + 's'));
    header.appendChild(timer);
  } else {
    header.appendChild(h('div', { class: 'q-timer' }, h('span', { class: 'muted-sm' }, '⏱ ' + q.timeLimit + 's limit')));
  }
  header.appendChild(h('div', { class: 'q-answered-pill' },
    h('span', { class: 'n' }, answered),
    h('span', {}, 'of ' + participants + ' answered')));
  wrap.appendChild(header);
  wrap.appendChild(h('div', { class: 'quiz-question' }, q.text));

  const optionsWrap = h('div', { class: 'quiz-options' });
  const counts = new Array(q.options.length).fill(0);
  q.votes.forEach(v => { if (v.value >= 0 && v.value < counts.length) counts[v.value]++; });
  const totalVotes = q.votes.length || 1;

  q.options.forEach((opt, i) => {
    const isCorrect = i === q.correctIndex;
    const isMine = mineVote && mineVote.value === i;
    const pct = Math.round(counts[i] / totalVotes * 100);
    const classes = ['quiz-opt'];
    if (revealed && isCorrect) classes.push('correct');
    if (revealed && !isCorrect && counts[i] > 0) classes.push('wrong');
    if (isMine) classes.push('mine');
    const canPick = !isPresenter && q.status === 'active' && !mineVote;
    if (canPick) classes.push('pickable');
    const optEl = h('div', { class: classes.join(' ') },
      h('div', { class: 'opt-bar', style: { width: (revealed || q.status === 'active' ? pct + '%' : '0%') } }),
      h('div', { class: 'opt-letter' }, LETTERS[i]),
      h('div', { class: 'opt-text' }, opt),
      (revealed || q.status === 'active') ? h('div', { class: 'opt-count' }, counts[i] + (revealed ? ' · ' + pct + '%' : '')) : null);
    if (canPick) optEl.addEventListener('click', () => submitQuizAnswer(q, i));
    optionsWrap.appendChild(optEl);
  });
  wrap.appendChild(optionsWrap);

  if (isPresenter) {
    const actions = h('div', { class: 'quiz-actions' });
    const isCurrent = idx === state.quiz.currentIndex;
    const canReveal = q.status === 'active' && isCurrent;
    const canNext = q.status === 'revealed' && isCurrent;
    const isLast = idx === state.quiz.questions.length - 1;
    actions.appendChild(h('span', { class: 'participant-pill' },
      'Correct: ', h('b', {}, LETTERS[q.correctIndex] + '. ' + q.options[q.correctIndex])));
    actions.appendChild(h('span', { class: 'spacer' }));
    if (canReveal) actions.appendChild(btn('👁 Reveal answer', 'btn-ok', () => revealQuestion(q)));
    if (canNext) actions.appendChild(btn(isLast ? '🏁 Finish quiz' : 'Next question →', 'btn-primary', nextQuestion));
    actions.appendChild(btn('Edit', 'btn-ghost btn-sm', () => openQuizComposer(idx)));
    actions.appendChild(btn('Delete', 'btn-ghost btn-sm danger', () => {
      if (!confirm('Delete this question?')) return;
      state.quiz.questions.splice(idx, 1);
      if (state.quiz.currentIndex >= state.quiz.questions.length) state.quiz.currentIndex = state.quiz.questions.length - 1;
      save(); render(); toast('Question deleted');
    }));
    wrap.appendChild(actions);
  }

  if (revealed && !isPresenter) {
    const correctText = LETTERS[q.correctIndex] + '. ' + q.options[q.correctIndex];
    wrap.appendChild(h('div', { class: 'winner-card' },
      h('div', { class: 'trophy' }, '✅'),
      h('div', { class: 'w-info' },
        h('div', { class: 'w-title' }, 'Correct answer'),
        h('div', { class: 'w-name' }, correctText))));
  }

  if (revealed) {
    const winner = fastestCorrect(q);

/* ============================================================
   RENDER — PARTICIPANT QUIZ
   ============================================================ */
function participantQuiz() {
  const wrap = h('div', { class: 'page narrow' });
  const quiz = state.quiz;

  if (!getParticipantName()) {
    const join = h('section', { class: 'panel pad' });
    join.appendChild(h('div', { class: 'join-hero' },
      h('div', { class: 'icon' }, '👋'),
      h('h1', {}, 'Welcome to the quiz'),
      h('p', {}, 'Enter your name below so we can score your answers and add you to the leaderboard.'),
      h('div', { class: 'room-chip' }, '🔑 Room ' + state.code)));
    const input = h('input', { class: 'input', id: 'joinName', placeholder: 'Your name', maxlength: '24' });
    const doJoin = () => {
      const n = input.value.trim();
      if (!n) { toast('Please enter a name'); return; }
      setParticipantName(n);
      render();
      toast('Welcome, ' + n + '! Waiting for the host to start…');
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') doJoin(); });
    join.appendChild(h('div', { class: 'ask-row', style: { marginTop: '20px' } }, input, btn('Join quiz', 'btn-primary', doJoin)));
    wrap.appendChild(join);
    return wrap;
  }

  const head = h('section', { class: 'panel pad' });
  head.appendChild(h('div', { class: 'section-head' },
    h('h2', {}, '🎯 ' + quiz.title),
    h('span', { class: 'pill' + (quiz.status === 'running' ? '' : ' blue') }, quiz.status)));
  const myLb = getLeaderboard().find(r => r.voter === myId);
  head.appendChild(h('div', { class: 'quiz-meta', style: { gap: '20px' } },
    h('div', {}, 'Player: ', h('b', {}, getParticipantName())),
    h('div', {}, 'Questions: ', h('b', {}, quiz.questions.length)),
    h('div', {}, 'Your score: ', h('b', {}, myLb ? myLb.score.toLocaleString() : 0))));
  wrap.appendChild(head);

  if (quiz.status === 'idle' || quiz.status === 'finished') {
    const s = h('section', { class: 'panel pad' });
    s.appendChild(h('div', { class: 'empty-state' },
      h('div', { class: 'empty-icon' }, quiz.status === 'finished' ? '🏁' : '⏳'),
      h('p', {}, quiz.status === 'finished' ? 'Quiz finished!' : 'Waiting for the host to start…'),
      h('span', {}, quiz.status === 'finished' ? 'Check the leaderboard below.' : 'Get ready — the first question is coming up.')));
    wrap.appendChild(s);
  } else {
    const idx = quiz.currentIndex;
    const q = quiz.questions[idx];
    if (q) {
      const card = h('section', { class: 'panel pad' });
      card.appendChild(renderQuizQuestion(q, idx, false));
      wrap.appendChild(card);
    } else {
      const s = h('section', { class: 'panel pad' });
      s.appendChild(h('div', { class: 'empty-state' },
        h('div', { class: 'empty-icon' }, '⏳'), h('p', {}, 'Waiting…'),
        h('span', {}, 'The next question will appear here.')));
      wrap.appendChild(s);
    }
  }

  const lb = getLeaderboard();
  if (lb.length) {
    const lbCard = h('section', { class: 'panel pad' });
    lbCard.appendChild(h('div', { class: 'section-head' }, h('h2', {}, '🏅 Leaderboard')));
    const list = h('div', { class: 'lb' });
    lb.forEach((row, i) => {
      list.appendChild(h('div', { class: 'lb-row' + (i === 0 ? ' top1' : '') + (row.voter === myId ? ' you' : '') },
        h('div', { class: 'lb-rank' }, '#' + (i + 1)),
        h('div', { class: 'lb-name' }, row.name + (row.voter === myId ? ' (you)' : '')),
        h('div', { class: 'lb-correct' }, row.correct + ' correct'),
        h('div', { class: 'lb-score' }, row.score.toLocaleString())));
    });
    lbCard.appendChild(list);
    wrap.appendChild(lbCard);
  }
  return wrap;
}

/* ============================================================
   RENDER — DISPLAY MODE (LED WALL)
   ============================================================ */
function renderDisplay() {
  document.body.classList.add('display-mode');
  const quiz = state.quiz;
  const root = h('div', { class: 'display-root' });

  const bar = h('div', { class: 'display-bar' });
  bar.appendChild(h('div', { class: 'display-brand' },
    h('div', { class: 'logo' }, logoSvg()),
    h('div', { class: 'brand-text' }, 'PC ', h('span', {}, 'Express'), ' Pulse')));
  bar.appendChild(h('div', { class: 'display-room' },
    h('span', { class: 'lbl' }, 'Room'), h('span', { class: 'code' }, state.code)));
  if (quiz.status === 'running') bar.appendChild(h('div', { class: 'display-live' }, 'Live'));
  root.appendChild(bar);

  const body = h('div', { class: 'display-body' });

  if (quiz.status === 'idle' || !quiz.questions.length) {
    body.classList.add('display-center');
    body.appendChild(h('div', { class: 'display-eyebrow' }, 'PC Express Product Knowledge Quiz'));
    body.appendChild(h('div', { class: 'display-wait-icon' }, '🎯'));
    body.appendChild(h('h1', { class: 'display-h1' }, 'Get ready — the quiz begins soon'));
    body.appendChild(h('p', { class: 'display-lead' },
      'Scan the QR code on screen to join, then wait for the host to launch Question 1.'));
    root.appendChild(body);
    root.appendChild(h('div', { class: 'display-footer' },
      h('span', {}, '📱 Scan QR to join'),
      h('span', { class: 'sp' }, participantCount() + ' players joined')));
    return root;
  }

  if (quiz.status === 'finished') {
    const lb = getLeaderboard();
    body.classList.add('display-center');
    body.appendChild(h('div', { class: 'display-eyebrow' }, 'Quiz Complete'));
    body.appendChild(h('div', { class: 'display-wait-icon' }, '🏁'));
    body.appendChild(h('h1', { class: 'display-h1' }, 'Congratulations to our winners!'));
    body.appendChild(h('p', { class: 'display-lead' }, 'Thanks to everyone who played. Here are the final standings.'));
    if (lb.length) {
      const top = h('div', { style: { width: '100%', maxWidth: '960px', marginTop: '20px' } });
      const grid = h('div', { class: 'display-lb' });
      lb.slice(0, 8).forEach((row, i) => {
        grid.appendChild(h('div', { class: 'display-lb-row' + (i === 0 ? ' top1' : '') },
          h('div', { class: 'display-lb-rank' }, '#' + (i + 1)),
          h('div', { class: 'display-lb-name' }, row.name),
          h('div', { class: 'display-lb-correct' }, row.correct + ' correct'),
          h('div', { class: 'display-lb-score' }, row.score.toLocaleString())));
      });
      top.appendChild(grid);
      body.appendChild(top);
    }
    root.appendChild(body);
    return root;
  }

  const idx = quiz.currentIndex;
  const q = quiz.questions[idx];
  if (!q) { root.appendChild(body); return root; }

  const total = quiz.questions.length;
  const answered = q.votes.length;
  const participants = Math.max(participantCount(), answered);
  const revealed = q.status === 'revealed';
  const counts = new Array(q.options.length).fill(0);
  q.votes.forEach(v => { if (v.value >= 0 && v.value < counts.length) counts[v.value]++; });
  const totalVotes = q.votes.length || 1;

  const head = h('div', { class: 'display-qhead' });
  head.appendChild(h('div', { class: 'display-qbadge' }, 'Question ' + (idx + 1) + ' of ' + total));
  head.appendChild(h('div', { class: 'display-answered' },
    h('span', { class: 'n' }, answered),
    h('span', {}, 'of ' + participants + ' answered')));
  if (q.status === 'active') {
    const timer = h('div', { class: 'display-timer' });
    const circumference = 2 * Math.PI * 40;
    const initialPct = Math.max(0, (q.timeLimit - (Date.now() - q.startedAt) / 1000) / q.timeLimit);
    timer.appendChild(h('div', { class: 'num', 'data-timer-num': q.id }, Math.ceil(q.timeLimit * initialPct)));
    timer.appendChild(h('div', { class: 'ring' },
      h('svg', { viewBox: '0 0 90 90' },
        h('circle', { class: 'track', cx: '45', cy: '45', r: '40' }),
        h('circle', { class: 'prog', cx: '45', cy: '45', r: '40',
          'data-timer-ring': q.id,
          style: { strokeDasharray: circumference, strokeDashoffset: circumference * (1 - initialPct) } }))));
    head.appendChild(timer);
  }
  body.appendChild(head);
  body.appendChild(h('div', { class: 'display-q' }, q.text));

  const opts = h('div', { class: 'display-options' });
  q.options.forEach((opt, i) => {
    const isCorrect = i === q.correctIndex;
    const pct = Math.round(counts[i] / totalVotes * 100);
    const classes = ['display-opt'];
    if (revealed && isCorrect) classes.push('correct', 'winner');
    if (revealed && !isCorrect && counts[i] > 0) classes.push('wrong');
    opts.appendChild(h('div', { class: classes.join(' ') },
      h('div', { class: 'fill', style: { width: (revealed || q.status === 'active' ? pct + '%' : '0%') } }),
      h('div', { class: 'ltr' }, LETTERS[i]),
      h('div', { class: 'txt' }, opt),
      h('div', { class: 'cnt' }, counts[i]),
      h('div', { class: 'pct' }, pct + '%')));
  });
  body.appendChild(opts);

  if (revealed) {
    const winner = fastestCorrect(q);
    if (winner) {
      body.appendChild(h('div', { class: 'display-winner' },
        h('div', { class: 'tr' }, '🏆'),
        h('div', { class: 'info' },
          h('div', { class: 'lbl' }, 'Fastest correct answer'),
          h('div', { class: 'name' }, winner.name),
          h('div', { class: 'sub' }, ((winner.timestamp - q.startedAt) / 1000).toFixed(1) + 's · Correct')),
        h('div', { class: 'pts' }, '+' + winner.score)));
    }
    const lb = getLeaderboard();
    if (lb.length) {
      const grid = h('div', { class: 'display-lb' });
      lb.slice(0, 6).forEach((row, i) => {
        grid.appendChild(h('div', { class: 'display-lb-row' + (i === 0 ? ' top1' : '') },
          h('div', { class: 'display-lb-rank' }, '#' + (i + 1)),
          h('div', { class: 'display-lb-name' }, row.name),
          h('div', { class: 'display-lb-correct' }, row.correct + ' correct'),
          h('div', { class: 'display-lb-score' }, row.score.toLocaleString())));
      });
      body.appendChild(grid);
    }
  }

  root.appendChild(body);
  root.appendChild(h('div', { class: 'display-footer' },
    h('span', {}, '⚡ Powered by PC Express Pulse'),
    h('span', { class: 'sp' }, 'Room ' + state.code)));
  return root;
}

/* ============================================================
   RENDER — Q&A
   ============================================================ */
function qaSection(isPresenter) {
  const sec = h('section', { class: 'panel pad' });
  sec.appendChild(h('div', { class: 'section-head' },
    h('h2', {}, isPresenter ? 'Audience Questions' : 'Q&A'),
    h('span', { class: 'pill' }, state.questions.filter(q => !q.answered).length + ' open')));
  if (!isPresenter) {
    const input = h('input', { class: 'input', id: 'qaInput', placeholder: 'Ask a question…', maxlength: '140' });
    const send = () => { const t = input.value.trim(); if (!t) return; ask(t); input.value = ''; };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    sec.appendChild(h('div', { class: 'ask-row' }, input, btn('Ask', 'btn-primary', send)));
  }
  const list = h('div', { class: 'qa-list' });
  const qs = [...state.questions].sort((a, b) => {
    if (a.answered !== b.answered) return a.answered ? 1 : -1;
    return b.votes.length - a.votes.length;
  });
  if (!qs.length) list.appendChild(h('p', { class: 'empty' }, isPresenter ? 'No questions yet.' : 'No questions yet — be the first!'));
  qs.forEach(q => list.appendChild(qaItem(q, isPresenter)));
  sec.appendChild(list);
  return sec;
}

function qaItem(q, isPresenter) {
  const voted = q.votes.includes(myId);
  const item = h('div', { class: 'qa-item' + (q.answered ? ' answered' : '') });
  item.appendChild(h('button', { class: 'upvote' + (voted ? ' voted' : ''), onclick: () => toggleUpvote(q) },
    h('span', { class: 'caret' }, '▲'), h('span', {}, q.votes.length)));
  item.appendChild(h('div', { class: 'qa-body' },
    h('div', { class: 'qa-text' }, q.text),
    h('div', { class: 'qa-meta' }, q.answered ? 'Answered' : 'Open · ' + q.votes.length + ' upvotes')));
  if (isPresenter) {
    item.appendChild(h('div', { class: 'qa-acts' },
      h('button', { class: 'icon-btn', title: 'Present', onclick: () => { ui.presenting = q.id; render(); } }, '👁'),
      h('button', { class: 'icon-btn', title: 'Toggle answered', onclick: () => { q.answered = !q.answered; save(); render(); } }, q.answered ? '↺' : '✓'),
      h('button', { class: 'icon-btn danger', title: 'Delete', onclick: () => {
        state.questions = state.questions.filter(x => x.id !== q.id); save(); render(); toast('Question removed');
      }}, '✕')));
  }
  return item;
}

/* ============================================================
   POLL COMPOSER
   ============================================================ */
function openComposer() { composer = { type: 'multiple_choice', question: '', options: ['', ''] }; render(); }
function closeComposer() { composer = null; render(); }

function renderComposer() {
  const c = composer;
  const root = h('div', { class: 'overlay', onclick: e => { if (e.target === root) closeComposer(); } });
  const card = h('div', { class: 'modal' });
  card.appendChild(h('div', { class: 'modal-head' }, h('h2', {}, 'Create a poll'), h('button', { class: 'icon-btn', onclick: closeComposer }, '✕')));
  const body = h('div', { class: 'modal-body' });
  body.appendChild(h('label', { class: 'field' }, h('span', {}, 'Question'),
    h('input', { class: 'input', id: 'composerQ', placeholder: 'What do you want to ask?', value: c.question, maxlength: '160', oninput: e => { c.question = e.target.value; } })));
  const chips = h('div', { class: 'chips' });
  Object.entries(TYPE_LABEL).forEach(([val, label]) => {
    chips.appendChild(h('button', { class: 'chip' + (c.type === val ? ' active' : ''), onclick: () => { c.type = val; render(); } }, label));
  });
  body.appendChild(h('div', { class: 'field' }, h('span', {}, 'Type'), chips));
  if (c.type === 'multiple_choice') {
    const wrap = h('div', { class: 'field' }, h('span', {}, 'Answer options'));
    c.options.forEach((o, i) => {
      const row = h('div', { class: 'opt-row' });
      row.appendChild(h('input', { class: 'input', value: o, placeholder: 'Option ' + (i + 1), maxlength: '80', oninput: e => { c.options[i] = e.target.value; } }));
      if (c.options.length > 2) row.appendChild(h('button', { class: 'icon-btn danger', onclick: () => { c.options.splice(i, 1); render(); } }, '✕'));
      wrap.appendChild(row);
    });
    if (c.options.length < 6) wrap.appendChild(h('button', { class: 'btn btn-ghost btn-sm', style: { alignSelf: 'flex-start' }, onclick: () => { c.options.push(''); render(); } }, '+ Add option'));
    body.appendChild(wrap);
  }
  body.appendChild(h('div', { class: 'modal-foot' }, btn('Cancel', 'btn-ghost', closeComposer), btn('Create poll', 'btn-primary', saveComposer)));
  card.appendChild(body); root.appendChild(card); return root;
}

function saveComposer() {
  const c = composer;
  const q = c.question.trim();
  if (!q) { toast('Please enter a question'); return; }
  let options = [];
  if (c.type === 'multiple_choice') {
    options = c.options.map(o => o.trim()).filter(Boolean);
    if (options.length < 2) { toast('Add at least 2 options'); return; }
  }
  state.polls.push({ id: uid(), type: c.type, question: q, options, status: 'draft', votes: [] });
  composer = null; save(); render(); toast('Poll created');
}

  body.appendChild(h('div', { class: 'field' }, h('span', {}, 'Time limit (10–60 seconds)'),
    h('div', { class: 'time-slider' },
      h('input', { type: 'range', min: '10', max: '60', step: '5', value: c.timeLimit, id: 'qcTime',
        oninput: e => { c.timeLimit = Number(e.target.value); document.getElementById('qcTimeVal').textContent = c.timeLimit + 's'; } }),
      h('output', { id: 'qcTimeVal' }, c.timeLimit + 's'))));
  body.appendChild(h('div', { class: 'modal-foot' },
    btn('Cancel', 'btn-ghost', closeQuizComposer),
    btn(c.editIndex !== null ? 'Save changes' : 'Add question', 'btn-primary', saveQuizComposer)));
  card.appendChild(body); root.appendChild(card); return root;
}

function saveQuizComposer() {
  const c = quizComposer;
  const text = c.text.trim();
  if (!text) { toast('Please enter the question'); return; }
  const options = c.options.map(o => o.trim()).filter(Boolean);
  if (options.length < 2) { toast('Add at least 2 options'); return; }
  if (c.correctIndex >= options.length) c.correctIndex = 0;
  if (c.editIndex !== null) {
    const q = state.quiz.questions[c.editIndex];
    q.text = text; q.options = options; q.correctIndex = c.correctIndex; q.timeLimit = c.timeLimit;
  } else {
    state.quiz.questions.push({
      id: uid(), text, options, correctIndex: c.correctIndex, timeLimit: c.timeLimit,
      status: 'idle', startedAt: null, votes: []
    });
  }
  quizComposer = null; save(); render(); toast('Question saved');
}

/* ============================================================
   OPEN INVITE TAB
   ============================================================ */
function openInviteTab() {
  const inviteUrl = window.location.origin + window.location.pathname + '?room=' + encodeURIComponent(state.code) + '&invite=1';
  window.open(inviteUrl, '_blank', 'noopener');
}

/* ============================================================
   PRESENT OVERLAY
   ============================================================ */
function renderPresenting() {
  const q = state.questions.find(x => x.id === ui.presenting);
  if (!q) { ui.presenting = null; return null; }
  const overlay = h('div', { class: 'present-overlay', onclick: () => { ui.presenting = null; render(); } },
    h('h1', {}, q.text),
    h('div', { class: 'present-votes' }, '▲ ' + q.votes.length + ' upvotes'),
    h('div', { class: 'present-hint' }, 'Click anywhere to exit'));
  return overlay;
}

/* ============================================================
   SUBNAV + MAIN RENDER
   ============================================================ */
function renderSubnav() {
  const activeQuiz = state.quiz.status === 'running';
  const navBar = h('nav', { class: 'subnav' });
  [{ id: 'polls', label: '📊 Polls' },
   { id: 'quiz', label: '🎯 Quiz', dot: activeQuiz },
   { id: 'qa', label: '💬 Q&A' }].forEach(item => {
    const b = h('button', {
      class: nav === item.id ? 'active' : '',
      onclick: () => { nav = item.id; sessionStorage.setItem('pcx.pulse.nav', nav); render(); }
    }, item.label);
    if (item.dot) b.appendChild(h('span', { class: 'dot' }));
    navBar.appendChild(b);
  });
  return navBar;
}

const app = document.getElementById('app');
const modalRoot = document.getElementById('modalRoot');

function render() {
  const active = document.activeElement;
  const focusId = active && active.id ? active.id : null;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;

  /* Invite tab */
  if (role === 'invite') {
    document.body.classList.add('invite-mode');
    document.body.classList.remove('display-mode');
    app.innerHTML = '';
    app.appendChild(renderInvitePage());
    modalRoot.innerHTML = '';
    return;
  }
  document.body.classList.remove('invite-mode');

  /* LED Wall display */
  if (role === 'display') {
    document.body.classList.add('display-mode');
    app.innerHTML = '';
    app.appendChild(renderDisplay());
    modalRoot.innerHTML = '';
    return;
  }
  document.body.classList.remove('display-mode');

  /* Role UI */
  const seg = document.getElementById('roleSeg');
  const lock = document.getElementById('lockBadge');
  if (roleLocked) {
    seg.style.display = 'none';
    lock.style.display = 'inline-flex';
    lock.textContent = role === 'participant' ? '🔒 Participant' : '🔒 Presenter';
  } else {
    seg.style.display = 'flex';
    lock.style.display = 'none';
    document.querySelectorAll('#roleSeg button').forEach(b => b.classList.toggle('active', b.dataset.role === role));
  }
  document.getElementById('roomCodeBtn').textContent = state.code;

  if (role === 'participant' && state.quiz.status === 'running' && nav !== 'quiz') nav = 'quiz';

  app.innerHTML = '';
  app.appendChild(renderSubnav());

  if (role === 'presenter') {
    if (nav === 'polls') app.appendChild(presenterPolls());
    else if (nav === 'quiz') app.appendChild(presenterQuiz());
    else {
      const wrap = h('div', { class: 'page narrow' });
      wrap.appendChild(qaSection(true));
      app.appendChild(wrap);
    }
  } else {
    if (nav === 'quiz') app.appendChild(participantQuiz());
    else if (nav === 'polls') {
      const wrap = h('div', { class: 'page narrow' });
      const live = state.polls.filter(p => p.status === 'live');
      const sec = h('section', { class: 'panel pad' });
      sec.appendChild(h('div', { class: 'section-head' }, h('h2', {}, 'Live Polls'), h('span', { class: 'pill' }, live.length + ' open')));
      if (!live.length) sec.appendChild(h('div', { class: 'empty-state' },
        h('div', { class: 'empty-icon' }, '📡'), h('p', {}, 'No live polls right now'),
        h('span', {}, 'Check the Quiz or Q&A tab.')));
      else live.forEach(p => sec.appendChild(participantPoll(p)));
      wrap.appendChild(sec);
      app.appendChild(wrap);
    } else {
      const wrap = h('div', { class: 'page narrow' });
      wrap.appendChild(qaSection(false));
      app.appendChild(wrap);
    }
  }

  modalRoot.innerHTML = '';
  if (composer) modalRoot.appendChild(renderComposer());
  else if (quizComposer) modalRoot.appendChild(renderQuizComposer());
  else if (ui.presenting) {
    const p = renderPresenting();
    if (p) modalRoot.appendChild(p);
  }

  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus();
      if (selStart !== null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selStart); } catch (e) {}
      }
    }
  }
}

/* ============================================================
   PARTICIPANT POLL CARD
   ============================================================ */
function participantPoll(poll) {
  const card = h('article', { class: 'poll-card' });
  const mine = poll.votes.find(v => v.voter === myId);
  card.appendChild(h('div', { class: 'poll-card-head' },
    h('span', { class: 'badge' }, TYPE_LABEL[poll.type]),
    h('span', { class: 'status live' }, 'Live')));
  card.appendChild(h('h3', { class: 'poll-card-q' }, poll.question));

  if (poll.type === 'multiple_choice') {
    const opts = h('div', { class: 'options' });
    poll.options.forEach((o, i) => {
      opts.appendChild(h('button', {
        class: 'option' + (mine && Number(mine.value) === i ? ' chosen' : ''),
        onclick: () => vote(poll, i)
      }, h('span', { class: 'opt-mark' }), h('span', {}, o)));
    });
    card.appendChild(opts);
  } else if (poll.type === 'rating') {
    const row = h('div', { class: 'rating-row' });
    for (let i = 0; i < 5; i++) {
      row.appendChild(h('button', {
        class: 'rate-btn' + (mine && Number(mine.value) === i ? ' chosen' : ''),
        onclick: () => vote(poll, i)
      }, String(i + 1)));
    }
    card.appendChild(row);
    card.appendChild(h('div', { class: 'rating-labels' }, h('span', {}, 'Poor'), h('span', {}, 'Excellent')));
  } else if (poll.type === 'word_cloud') {
    const input = h('input', { class: 'input', placeholder: 'Type a word…', maxlength: '24' });
    const send = () => { const v = input.value.trim(); if (!v) return; vote(poll, v); };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    card.appendChild(h('div', { class: 'ask-row' }, input, btn('Send', 'btn-primary', send)));
  } else {
    const ta = h('textarea', { class: 'input', placeholder: 'Share your thoughts…', maxlength: '300' });
    card.appendChild(h('div', { class: 'field' }, ta));
    card.appendChild(h('div', { style: { display: 'flex', justifyContent: 'flex-end', marginTop: '12px' } },
      btn('Submit', 'btn-primary', () => { const v = ta.value.trim(); if (!v) return; vote(poll, v); })));
  }

  if (mine) {
    card.appendChild(h('div', { class: 'thanks', style: { marginTop: '20px', marginBottom: '16px' } },
      h('span', {}, '✓'), h('span', {}, 'Your response has been counted')));
    card.appendChild(h('div', { class: 'mini-results' }, renderResults(poll)));
  }
  return card;
}

/* ============================================================
   EVENTS
   ============================================================ */
document.getElementById('roleSeg').addEventListener('click', e => {
  if (roleLocked) return;
  const b = e.target.closest('button[data-role]');
  if (!b) return;
  role = b.dataset.role;
  sessionStorage.setItem('pcx.pulse.role', role);
  ui.selectedPollId = null;
  render();
});

document.getElementById('roomCodeBtn').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(state.code); toast('Room code copied'); }
  catch (e) { toast('Room code: ' + state.code); }
});

window.addEventListener('storage', e => {
  if (e.key !== KEY) return;
  try {
    const next = JSON.parse(e.newValue);
    if (next && Array.isArray(next.polls) && next.quiz) { state = next; render(); }
  } catch (err) {}
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (composer) composer = null;
    else if (quizComposer) quizComposer = null;
    else if (ui.presenting) ui.presenting = null;
    else return;
    render();
  }
});

/* ============================================================
   INIT
   ============================================================ */
save();
render();
ensureTimerLoop();
</script>
</body>
</html>
